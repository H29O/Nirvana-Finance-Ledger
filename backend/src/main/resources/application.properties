spring.application.name=backend
server.port = 2906
spring.datasource.url = jdbc:postgresql://localhost:5432/finance_db
spring.datasource.username = postgres
spring.datasource.password = 1670

spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true
spring.jpa.properties.hibernate.format_sql = true

# JWT Configuration
jwt.secret=40A41D05D9D5CF04128D8A7490A2E2AD752671569B1FA04C10C6A5A37144D3F0
jwt.expiration=86400000

# Multipart Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Receipt Storage Configuration
app.receipt.storage-path=uploads/receipts

# OCR Configuration (PaddleOCR Service)
app.ocr.paddle.url=${PADDLE_OCR_URL:http://localhost:5005}
app.ocr.paddle.timeout-ms=${PADDLE_OCR_TIMEOUT_MS:30000}

# Mail Configuration (Gmail SMTP via JavaMailSender)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:${GMAIL_USERNAME:${GMAIL_ADDRESS:}}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${GMAIL_APP_PASSWORD:${Google:}}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${APP_MAIL_FROM:${spring.mail.username:}}

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
