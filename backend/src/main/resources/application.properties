spring.application.name=backend
server.port=${PORT:2906}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:finance_db}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto = validate
spring.jpa.show-sql = true
spring.jpa.properties.hibernate.format_sql = true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Multipart Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Receipt Storage Configuration
app.receipt.storage-path=uploads/receipts

# OCR Configuration (PaddleOCR Service)
app.ocr.paddle.url=${PADDLE_OCR_URL:http://localhost:5005}
app.ocr.paddle.timeout-ms=${PADDLE_OCR_TIMEOUT_MS:30000}
app.ocr.auto-start.enabled=${OCR_AUTO_START_ENABLED:true}
app.ocr.auto-start.working-dir=${OCR_WORKING_DIR:}
app.ocr.auto-start.python-path=${OCR_PYTHON_PATH:}
app.ocr.auto-start.script-path=${OCR_SCRIPT_PATH:}
app.ocr.auto-start.readiness-timeout-ms=${OCR_READINESS_TIMEOUT_MS:30000}

# Mail Configuration (Gmail SMTP via JavaMailSender)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:${GMAIL_USERNAME:${GMAIL_ADDRESS:}}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${GMAIL_APP_PASSWORD:${Google:}}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${APP_MAIL_FROM:${spring.mail.username:}}

# Frontend Base URL (for password reset and email links)
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Timezone Configuration
app.timezone=${APP_TIMEZONE:Asia/Kolkata}

# Receipt Retention & Scheduled Cleanup (Daily at 2:00 AM)
app.receipt.cleanup.cron=${RECEIPT_CLEANUP_CRON:0 0 2 * * ?}
