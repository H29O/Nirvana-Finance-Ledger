server {
    listen 8080 default_server;
    server_name localhost 127.0.0.1;

    # Maximum upload size for receipt scans
    client_max_body_size 25M;

    # Access and error logs
    access_log /Users/heetoswal/Documents/Nirvana-Finance-Ledger/logs/nginx-access.log;
    error_log /Users/heetoswal/Documents/Nirvana-Finance-Ledger/logs/nginx-error.log;

    # Static frontend production build
    root /Users/heetoswal/Documents/Nirvana-Finance-Ledger/frontend/dist;
    index index.html;

    # Immutable hashed static assets caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PWA icons and manifest
    location ~* \.(webmanifest|ico|svg|png)$ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # API reverse proxy to Spring Boot backend
    location /api/ {
        proxy_pass http://127.0.0.1:2906;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
    }

    # Single Page Application (SPA) routing fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
